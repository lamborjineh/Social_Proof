services:
  - type: web
    name: socialproof-backend
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: >
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/assets/uploads
      sizeGB: 1
